<div class="auth-page">
  <div class="login-box">
    <h2>Bienvenido</h2>
    <p>Inicia sesión para continuar</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group" [ngClass]="{'invalid': email.invalid && email.touched}">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" formControlName="email" required />
        <small *ngIf="email.hasError('required') && email.touched">Este campo es obligatorio</small>
        <small *ngIf="email.hasError('email') && email.touched">Correo inválido</small>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" required />
        <small *ngIf="password.hasError('required') && password.touched">Este campo es obligatorio</small>
        <small *ngIf="password.hasError('minlength') && password.touched">
          Mínimo 6 caracteres
        </small>
      </div>

      <button type="submit" [disabled]="loginForm.invalid">Entrar</button>
    </form>

    <p class="register-text">
      ¿No tienes cuenta?
      <a routerLink="/auth/register">Regístrate aquí</a> 
    </p>
  </div>
</div>
