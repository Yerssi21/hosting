<div class="forgot-page">
  <div class="forgot-card">
    <h1 class="forgot-title">Recuperar contraseña</h1>
    <p class="forgot-subtitle">
      Ingresa tu correo y te enviaremos un enlace seguro para restablecer tu contraseña.
    </p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="forgot-form-group" [ngClass]="{ 'invalid': email.invalid && email.touched }">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="tucorreo@ejemplo.com"
        />
        <div class="forgot-error" *ngIf="email.hasError('required') && email.touched">
          Este campo es obligatorio.
        </div>
        <div class="forgot-error" *ngIf="email.hasError('email') && email.touched">
          Ingresa un correo válido.
        </div>
      </div>

      <button class="forgot-btn" type="submit" [disabled]="form.invalid">
        Enviar enlace de recuperación
      </button>
    </form>

    <p class="forgot-back">
      ¿Ya recuerdas tu contraseña?
      <a routerLink="/auth/login">Volver al inicio de sesión</a>
    </p>
  </div>
</div>
