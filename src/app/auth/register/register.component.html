<div class="register-container">
  <div class="register-box">
    <h2>Crear cuenta</h2>
    <p>Regístrate para comenzar a vender con Laurvric Shop</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input id="nombre" type="text" formControlName="nombre" required />
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" formControlName="email" required />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" required />
      </div>

      <div class="form-group">
        <label for="confirmarPassword">Confirmar contraseña</label>
        <input id="confirmarPassword" type="password" formControlName="confirmarPassword" required />
      </div>

      <button type="submit" [disabled]="registerForm.invalid">Registrarse</button>
    </form>

    <p class="login-text">
      ¿Ya tienes cuenta?
      <a routerLink="/auth/login">Inicia sesión</a>
    </p>
  </div>
</div>
