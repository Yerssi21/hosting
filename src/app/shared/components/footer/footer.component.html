<footer class="footer">
  <div class="footer__container">
    <!-- ========================================================= -->
    <!--  COLUMNA 1: Marca + Enlaces                             -->
    <!-- ========================================================= -->
    <div class="footer__col">
      <h2 class="footer__brand">
        LAURRVIC <span>SHOP</span>
      </h2>

      <ul class="footer__links">
        <li><a routerLink="/home">Inicio</a></li>
        <li><a routerLink="/venta-online">Vender en Línea</a></li>
        <li><a routerLink="/haz-tu-pedido">Haz tu pedido</a></li>
        <li><a routerLink="/soporte-empresarial">Soporte</a></li>
        <li><a routerLink="/area-cliente">Área Cliente</a></li>
      </ul>
    </div>

    <!-- ========================================================= -->
    <!--  COLUMNA 2: Newsletter                                   -->
    <!-- ========================================================= -->
    <div class="footer__col footer__newsletter">
      <h3 class="footer__subtitle">Recibe novedades y descuentos</h3>

      <form
        action="https://formspree.io/f/mknkkrkj"
        method="POST"
        class="footer__form"
        aria-label="Formulario de suscripción"
      >
        <label class="sr-only" for="footerEmail">Correo electrónico</label>
        <input
          id="footerEmail"
          type="email"
          name="_replyto"
          placeholder="Tu correo electrónico"
          autocomplete="email"
          required
          class="footer__input"
        />

        <button
          type="submit"
          class="cta cta--primary footer__submit"
          aria-label="Suscribirse al boletín"
        >
          Suscribirse
        </button>
      </form>
    </div>

    <!-- ========================================================= -->
    <!--  COLUMNA 3: Redes Sociales                               -->
    <!-- ========================================================= -->
    <div class="footer__col footer__social">
      <h3 class="footer__subtitle">Síguenos</h3>

      <div class="footer__icons">
        <a
          href="#"
          target="_blank"
          rel="noopener"
          aria-label="Facebook"
          class="footer__icon"
        >
          <i class="bx bxl-facebook"></i>
        </a>
        <a
          href="#"
          target="_blank"
          rel="noopener"
          aria-label="Instagram"
          class="footer__icon"
        >
          <i class="bx bxl-instagram"></i>
        </a>
        <a
          href="#"
          target="_blank"
          rel="noopener"
          aria-label="YouTube"
          class="footer__icon"
        >
          <i class="bx bxl-youtube"></i>
        </a>
      </div>
    </div>
  </div>

  <!-- ========================================================= -->
  <!--  COPYRIGHT + BOTÓN “VOLVER ARRIBA”                        -->
  <!-- ========================================================= -->
  <div class="footer__copy">
    <p>
      © 2025 Laurrvic Shop — Diseñado con
      <span aria-hidden="true">💙</span> por
      <b>Yiseth Tovar</b>
    </p>

    <button
      class="footer__totop"
      type="button"
      (click)="scrollTop()"
      aria-label="Volver arriba"
    >
      <i class="bx bx-chevron-up"></i>
    </button>
  </div>
</footer>
